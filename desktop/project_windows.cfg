; Project settings for the Windows build only. desktop/build_windows.sh appends this file to
; a staged copy of project.godot before it exports the "Windows Desktop" preset, so the
; project itself, the editor, the tests and the web export never see these settings.
; Later keys win, so anything here overrides project.godot for the Windows build.

[application]

config/version="1.0.0"
config/windows_native_icon="res://desktop/icon.ico"
config/use_custom_user_dir=true
config/custom_user_dir_name="ProSkater"

[autoload]

Desktop="*res://desktop/desktop.gd"

[display]

; The game starts fullscreen (borderless, at the monitor's own resolution): desktop.gd switches
; to it at startup unless the player chose a window last time or a window option (--windowed,
; --resolution, --position, --screen) is on the command line. window/size/mode itself stays
; windowed because Godot 4.7's --windowed does not override a fullscreen project setting.
; F11 or Alt+Enter switch to a 1920x1080 window (smaller on a smaller screen) and back.
window/size/mode=0

[rendering]

; native OpenGL 3.3 measured faster than ANGLE on Direct3D 11 (docs/reports/windows-build.md);
; a PC without a working OpenGL 3.3 driver still falls back to ANGLE by itself
gl_compatibility/driver.windows="opengl3"
gl_compatibility/fallback_to_angle=true
